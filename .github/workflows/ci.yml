# Type-check, lint, unit tests, iOS and Android bundles, and browser tests
# (Playwright + axe) for the Expo web build. Native device runs need EAS (manual).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
        with:
          path: mobile
      # Apps link to ../shared packages (link: dependencies) until they are published.
      - uses: actions/checkout@v5
        with:
          repository: bibiyo21/mediconnect-shared
          path: shared
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            shared/pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - name: Build shared packages
        working-directory: shared
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Install
        working-directory: mobile
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --ci
      - name: Bundle for iOS and Android (Metro)
        run: pnpm export:ios && pnpm export:android
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests (Playwright + axe, API mocked)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: mobile/playwright-report
          retention-days: 7
